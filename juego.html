<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafío de la Dignidad | Estrada-Web</title>
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="css/animaciones.css">
    <link rel="stylesheet" href="css/juego.css">
    <style>
        .quiz-container { max-width: 800px; margin: 40px auto; padding: 20px; }
        .question-box { background: #fff; padding: 30px; border-radius: 12px; box-shadow: var(--sombra-pro); border-top: 5px solid var(--oro-honor); display: none; }
        .option-btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #ddd; border-radius: 8px; background: #f9f9f9; cursor: pointer; transition: 0.3s; text-align: left; font-size: 1rem; }
        .option-btn:hover { border-color: var(--azul-patria); background: #eef2ff; }
        .score-panel { text-align: center; padding: 20px; background: var(--azul-patria); color: white; border-radius: 8px; margin-bottom: 20px; }
        .active { display: block !important; }
        .feedback-correct { color: #2ecc71; font-weight: bold; }
        .feedback-wrong { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">ESTRADA-WEB</a>
            <ul class="nav-links">
                <li><a href="biografia.html">Biografía</a></li>
                <li><a href="batalla-san-jacinto.html">San Jacinto</a></li>
                <li><a href="juego.html" class="active">Desafío</a></li>
                <li><a href="index.html" class="btn-login">Volver</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content anim-heroica">
        <div class="score-panel">
            <h3 id="rango-display">Rango: Recluta del Septentrión</h3>
            <p>Puntos de Honor: <span id="puntos-display">0</span></p>
        </div>

        <div id="intro-juego" class="text-center">
            <h2>Desafío de la Dignidad Nacional</h2>
            <p>Demuestra tu conocimiento sobre la gesta del General Estrada y los módulos de formación política.</p>
            <br>
            <button onclick="iniciarDesafio()" class="btn-p">Iniciar Batalla de Conocimiento</button>
        </div>

        <div id="quiz-wrapper" class="quiz-container">
            </div>
    </main>

    <script>
        const preguntas = [
            {
                q: "¿En qué fecha y lugar nació el General José Dolores Estrada Vado?",
                options: ["14 de Septiembre de 1856", "16 de Marzo de 1792 en Nandaime", "12 de Agosto de 1869"],
                correct: 1,
                info: "Registrado en su biografía oficial del Ejército de Nicaragua."
            },
            {
                q: "¿Cuál es el núcleo del legado de Estrada según la Gaceta Sandinista?",
                options: ["La expansión territorial", "La defensa de la dignidad y el antifilibusterismo", "La diplomacia extranjera"],
                correct: 1,
                info: "Representa la lucha por la autodeterminación nacional."
            },
            {
                q: "¿Qué táctica fue decisiva en la Hacienda San Jacinto?",
                options: ["El uso de artillería pesada", "La estampida de caballos por el flanco izquierdo", "La retirada a Nandaime"],
                correct: 1,
                info: "Maniobra estratégica que sembró el pánico en los filibusteros."
            }
        ];

        let indexActual = 0;
        let puntos = 0;

        function iniciarDesafio() {
            document.getElementById('intro-juego').style.display = 'none';
            mostrarPregunta();
        }

        function mostrarPregunta() {
            const wrapper = document.getElementById('quiz-wrapper');
            if (indexActual >= preguntas.length) {
                finalizarJuego();
                return;
            }

            const data = preguntas[indexActual];
            wrapper.innerHTML = `
                <div class="question-box active anim-heroica">
                    <h4>Pregunta ${indexActual + 1}:</h4>
                    <p style="font-size: 1.2rem; margin: 15px 0;">${data.q}</p>
                    ${data.options.map((opt, i) => `
                        <button class="option-btn" onclick="validarRespuesta(${i})">${opt}</button>
                    `).join('')}
                </div>
            `;
        }

        function validarRespuesta(i) {
            const data = preguntas[indexActual];
            if (i === data.correct) {
                puntos += 500;
                alert("¡Correcto! " + data.info);
            } else {
                alert("Incorrecto. " + data.info);
            }
            
            indexActual++;
            actualizarUI();
            mostrarPregunta();
        }

        function actualizarUI() {
            document.getElementById('puntos-display').innerText = puntos;
            if (puntos >= 1000) document.getElementById('rango-display').innerText = "Rango: Sargento de Septentrión";
            if (puntos >= 1500) document.getElementById('rango-display').innerText = "Rango: General de División";
        }

        function finalizarJuego() {
            const wrapper = document.getElementById('quiz-wrapper');
            wrapper.innerHTML = `
                <div class="question-box active text-center">
                    <h2>¡Misión Cumplida!</h2>
                    <p>Has obtenido ${puntos} puntos de honor.</p>
                    <p>Tu rango final es: ${document.getElementById('rango-display').innerText}</p>
                    <br>
                    <a href="index.html" class="btn-p">Volver al Cuartel General</a>
                </div>
            `;
        }
    </script>
</body>
</html>
